# ==============================================================================
# football-cv: Fast / Smoke Test Configuration
# Subsampled frame window and lightweight parameters for rapid testing
# ==============================================================================

model:
  path: "models/best.pt"
  confidence: 0.20
  device: "cpu"
  batch_size: 10

video:
  input_path: "input_videos/08fd33_4.mp4"
  output_path: "output_videos/fast_output.avi"
  frame_rate: 25.0
  start_frame: 0
  end_frame: 50         # Process first 50 frames

tracking:
  use_cached_tracks: true
  cache_path: "stubs/track_stubs.pkl"
  camera_movement_cache_path: "stubs/camera_movement_stubs.pkl"

possession:
  max_player_ball_distance: 70.0
  minimum_control_frames: 2
  maximum_missing_ball_frames: 5

movement:
  speed_window_frames: 5
  minimum_displacement: 0.1

perspective:
  pixel_vertices:
    - [110, 1035]
    - [265, 275]
    - [910, 260]
    - [1640, 915]
  court_width: 68.0
  court_length: 23.32

analytics:
  enabled: true
  export_events: true
  export_dir: "outputs/fast_analytics"
  heatmap:
    enabled: true
    grid_width: 30
    grid_height: 20
  pass_network:
    enabled: true
    maximum_transition_frames: 10

logging:
  level: "DEBUG"
  log_file: "outputs/logs/football-cv-fast.log"
