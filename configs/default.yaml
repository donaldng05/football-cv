# ==============================================================================
# football-cv: Default Balanced Configuration
# Optimized for 1080p broadcast match footage analysis
# ==============================================================================

model:
  path: "models/best.pt"
  confidence: 0.25
  device: "auto"        # "auto", "cpu", "cuda", or GPU ID e.g. "0"
  batch_size: 20
  engine: "ultralytics" # "ultralytics" | "onnx"
  class_confidences:
    player: 0.25
    goalkeeper: 0.25
    referee: 0.25
    ball: 0.12

video:
  input_path: "input_videos/08fd33_4.mp4"
  output_path: "output_videos/output_video.avi"
  frame_rate: 25.0
  start_frame: 0
  end_frame: null       # null processes all frames

tracking:
  use_cached_tracks: true
  cache_path: "stubs/track_stubs.pkl"
  camera_movement_cache_path: "stubs/camera_movement_stubs.pkl"
  track_activation_threshold: 0.25
  lost_track_buffer: 60
  minimum_matching_threshold: 0.70
  ball_tracker_max_distance: 200.0
  ball_min_confidence: 0.15
  enable_reid_sanitizer: true

camera_motion:
  minimum_distance: 5.0
  scene_cut_threshold: 80.0
  margin_ratio_x: 0.05
  margin_ratio_y: 0.10
  use_dynamic_margins: true

possession:
  max_player_ball_distance: 70.0
  max_player_ball_distance_meters: 2.0
  use_metric_distance: true
  minimum_control_frames: 3
  maximum_missing_ball_frames: 15
  ball_interpolation_method: "quadratic"

movement:
  speed_window_frames: 5
  minimum_displacement: 0.05
  method: "rolling"
  max_speed_kmh: 38.0
  enable_smoothing: true
  min_speed_mps: 0.5

team_classification:
  color_space: "lab"
  sample_frames: 15
  voting_window: 10
  min_box_area: 800.0

perspective:
  pixel_vertices:
    - [110, 1035]
    - [265, 275]
    - [910, 260]
    - [1640, 915]
  court_width: 68.0
  court_length: 23.32
  out_of_bounds_policy: "strict"

analytics:
  enabled: true
  export_events: true
  export_dir: "outputs/analytics"
  heatmap:
    enabled: true
    grid_width: 60
    grid_height: 40
  pass_network:
    enabled: true
    maximum_transition_frames: 35

vision:
  backend: "python"

streaming:
  enabled: false
  chunk_size: 64
  warmup_frames: 30
  max_buffer_frames: 120

logging:
  level: "INFO"
  log_file: "outputs/logs/football-cv.log"

