[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-cv"
version = "0.1.0"
description = "Computer Vision & Advanced Football Analytics Pipeline"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Quy Duong" }
]
requires-python = ">=3.9"
keywords = [
    "computer-vision",
    "football-analytics",
    "sports-analytics",
    "yolov8",
    "bytetrack",
    "object-tracking",
    "optical-flow",
    "homography"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "supervision>=0.20.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pybind11>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
football-cv = "football_cv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["development_and_analysis"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
filterwarnings = [
    "ignore:.*ByteTrack.*:FutureWarning",
    "ignore::FutureWarning:supervision.*",
    "ignore::UserWarning:sklearn.*",
]
markers = [
    "parity: Numerical parity tests comparing Python and native C++ vision implementations",
]

