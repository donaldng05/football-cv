name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Formatting Check
        run: ruff format --check .

  test:
    name: Test Suite & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Package and Test Dependencies
        run: pip install -e ".[dev]"

      - name: Ensure Test Video Asset
        run: python scripts/generate_dummy_video.py

      - name: Run Test Suite with Coverage
        run: pytest --cov=football_cv --cov-report=term-missing --cov-report=xml

  cli-validate:
    name: CLI Pre-Flight Sanity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Package
        run: pip install -e .

      - name: Ensure Test Video Asset
        run: python scripts/generate_dummy_video.py

      - name: Run CLI Validation on Fast Profile
        run: football-cv validate --config configs/fast.yaml
