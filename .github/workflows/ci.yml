name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Formatting Check
        run: ruff format --check .

  test:
    name: Test Suite & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Package and Test Dependencies
        run: pip install -e ".[dev]"

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Build Native C++ Core Extension
        run: |
          cmake -B cpp/build -S cpp -DCMAKE_BUILD_TYPE=Release -DENABLE_ONNXRUNTIME=ON -DPython3_EXECUTABLE=$(which python)
          cmake --build cpp/build --config Release

      - name: Ensure Test Video Asset
        run: python scripts/generate_dummy_video.py

      - name: Ensure Test Model Asset
        run: python scripts/download_models.py --dummy

      - name: Run Test Suite with Coverage
        run: pytest --cov=football_cv --cov-report=term-missing --cov-report=xml

      - name: Run C++ Native Core Parity Tests
        run: pytest tests/parity/ -v

  cli-validate:
    name: CLI Pre-Flight Sanity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Package
        run: pip install -e .

      - name: Ensure Test Video Asset
        run: python scripts/generate_dummy_video.py

      - name: Ensure Test Model Asset
        run: python scripts/download_models.py --dummy

      - name: Run CLI Validation on Fast Profile
        run: football-cv validate --config configs/fast.yaml
