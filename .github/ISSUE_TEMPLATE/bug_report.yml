name: Bug Report
description: File a bug report to help improve football-cv
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help reproduce the issue.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or exact commands to reproduce the issue.
      placeholder: |
        1. Run 'football-cv analyze --config configs/fast.yaml'
        2. Observe error...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating System, Python version, compute device (CPU/CUDA).
      placeholder: "Windows 11 / Ubuntu 22.04, Python 3.11, CPU"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Stacktrace
      description: Please copy and paste any relevant logs or error output.
      render: shell
